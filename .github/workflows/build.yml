name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  colcon:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src_checkout

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep \
            ros-jazzy-nav2-msgs ros-jazzy-tf2-ros ros-jazzy-visualization-msgs \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs python3-numpy
          rosdep init || true
          rosdep update

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p ws/src
          cp -r src_checkout/src/* ws/src/
          cd ws
          colcon build --packages-skip px4_msgs --continue-on-error \
            --event-handlers console_direct+

      - name: Python syntax check
        shell: bash
        run: |
          python3 -m compileall -q src_checkout/src/garudanex_explore
          python3 -m compileall -q src_checkout/src/garudanex_sim/tools
          echo "python syntax OK"
